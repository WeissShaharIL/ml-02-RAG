services:

  postgres:
    image: postgres:16-alpine
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    build: ./ollama
    container_name: rag-ollama
    restart: unless-stopped
    environment:
      OLLAMA_NUM_GPU: 0
    volumes:
      - ./data/ollama:/root/.ollama
    ports:
      - "11434:11434"

  backend:
    build: ./backend
    container_name: rag-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://rag:rag@postgres:5432/rag
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_JUDGE_MODEL: ${OLLAMA_JUDGE_MODEL:-llama3.2:3b}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend-chat:
    build: ./frontend-chat
    container_name: rag-chat
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  frontend-dash:
    build: ./frontend-dash
    container_name: rag-dash
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend